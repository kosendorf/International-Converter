<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#007bff">
    <title>International Converter</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="manifest" href="./manifest.json">
</head>
<body>
    <div class="wrapper">
        <h1>International Converter</h1>
        
        <div class="tabs">
            <button id="btn-units" class="tab-btn active">Units</button>
            <button id="btn-currency" class="tab-btn">Currency</button>
        </div>
        
        <!-- UNIT CONVERTER VIEW -->
        <div id="view-units" class="view-section active">
            <div class="card">
                <h2>Weight</h2>
                <div class="input-group">
                    <label for="kilos">Kilograms (kg):</label>
                    <input type="number" id="kilos" placeholder="0.00" step="any">
                </div>
                <div class="input-group">
                    <label for="pounds">Pounds (lbs):</label>
                    <input type="number" id="pounds" placeholder="0.00" step="any">
                </div>
            </div>

            <div class="card">
                <h2>Speed</h2>
                <div class="input-group">
                    <label for="kph">Kilometers per Hour (kph):</label>
                    <input type="number" id="kph" placeholder="0.00" step="any">
                </div>
                <div class="input-group">
                    <label for="mph">Miles per Hour (mph):</label>
                    <input type="number" id="mph" placeholder="0.00" step="any">
                </div>
            </div>

            <div class="card">
                <h2>Distance</h2>
                <div class="input-group">
                    <label for="km">Kilometers (km):</label>
                    <input type="number" id="km" placeholder="0.00" step="any">
                </div>
                <div class="input-group">
                    <label for="miles">Miles (mi):</label>
                    <input type="number" id="miles" placeholder="0.00" step="any">
                </div>
            </div>
        </div>
        
        <!-- CURRENCY CONVERTER VIEW -->
        <div id="view-currency" class="view-section">
            <div class="card">
                <h2>Live Exchange Rates</h2>
                <p id="currency-status" class="status-text">Fetching rates...</p>
                <div class="input-group">
                    <label for="currency-from">From:</label>
                    <div class="currency-row">
                        <select id="currency-from">
                            <!-- Populated dynamically via app.js -->
                        </select>
                        <input type="number" id="amount-from" placeholder="0.00" step="any">
                    </div>
                </div>
                
                <div class="input-group">
                    <label for="currency-to">To:</label>
                    <div class="currency-row">
                        <select id="currency-to">
                            <!-- Populated dynamically via app.js -->
                        </select>
                        <input type="number" id="amount-to" placeholder="0.00" step="any">
                    </div>
                </div>
            </div>
            
            <!-- CALCULATOR -->
            <div class="card">
                <h2>Shopping Calculator</h2>
                <div class="input-group">
                    <input type="text" id="calc-display" readonly placeholder="0" style="text-align: right; font-size: 1.25rem; font-family: monospace;">
                </div>
                <div class="calc-grid">
                    <button type="button" onclick="calcAppend('7')">7</button>
                    <button type="button" onclick="calcAppend('8')">8</button>
                    <button type="button" onclick="calcAppend('9')">9</button>
                    <button type="button" onclick="calcOp('/')">/</button>
                    
                    <button type="button" onclick="calcAppend('4')">4</button>
                    <button type="button" onclick="calcAppend('5')">5</button>
                    <button type="button" onclick="calcAppend('6')">6</button>
                    <button type="button" onclick="calcOp('*')">*</button>
                    
                    <button type="button" onclick="calcAppend('1')">1</button>
                    <button type="button" onclick="calcAppend('2')">2</button>
                    <button type="button" onclick="calcAppend('3')">3</button>
                    <button type="button" onclick="calcOp('-')">-</button>
                    
                    <button type="button" onclick="calcAppend('0')">0</button>
                    <button type="button" onclick="calcAppend('.')">.</button>
                    <button type="button" onclick="calcClear()">C</button>
                    <button type="button" onclick="calcOp('+')">+</button>
                    
                    <!-- Backspace and Equals -->
                    <button type="button" class="push-anim" onclick="calcBackSpace()" style="grid-column: span 2; background-color: #f1f1f6;">⌫ Backspace</button>
                    <button type="button" class="push-anim" onclick="calcCalculate()" style="grid-column: span 2; background-color: #007bff; color: white;">=</button>
                </div>
                <div class="calc-actions" style="margin-top: 1rem; display: flex; gap: 0.5rem;">
                    <button type="button" class="tab-btn push-anim" style="border: 1px solid #ccc; background: white;" onclick="pushToCurrency(false)">Send to 'From'</button>
                    <button type="button" class="tab-btn push-anim" style="border: 1px solid #ccc; background: white;" onclick="pushToCurrency(true)">Send to 'To'</button>
                </div>
            </div>
        </div>

    </div>
    <script src="./app.js"></script>
</body>
</html>
