<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#007bff">
    <title>Kilo to Pound Converter</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="manifest" href="./manifest.json">
</head>
<body>
    <div class="container">
        <h1>Weight Converter</h1>
        <div class="input-group">
            <label for="kilos">Kilograms (kg):</label>
            <input type="number" id="kilos" placeholder="Enter weight in kilos" step="0.01">
        </div>
        <div class="input-group">
            <label for="pounds">Pounds (lbs):</label>
            <input type="number" id="pounds" placeholder="Weight in pounds" readonly>
        </div>
    </div>
    <script src="./app.js"></script>
</body>
</html>
